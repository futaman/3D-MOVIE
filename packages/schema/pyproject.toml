[project]
name = "movie-schema"
version = "0.1.0"
description = "3D-MOVIE 共通スキーマ(アセット・シーン・ジョブ)。Pydantic を正とし JSON Schema / TS 型を生成する"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["movie_schema*"]
