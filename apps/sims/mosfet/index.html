<title>MOSFETの内側</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: 3D の実験台を全面に置き、左上に章、左下に「やってみよう」、右下に計器、右端に倍率の目盛り。スマホでは縦に積む。 */
:root {
  --bg: #0a1116;
  --bg-2: #101b22;
  --panel: rgba(14, 23, 30, 0.84);
  --line: #24343e;
  --fg: #e4ecee;
  --muted: #8ea3ab;
  --electron: #5fe1f5;
  --hole: #ff8a75;
  --gate: #d8a548;
  --ion: #a99bff;
  --ok: #8fe3a1;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; overflow: hidden; }
[hidden] { display: none !important; }
.app { position: relative; height: 100%; }
.viewport { position: absolute; inset: 0; background: radial-gradient(120% 90% at 60% 40%, var(--bg-2), var(--bg)); }
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.viewport canvas:active { cursor: grabbing; }
.fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
.fade.on { opacity: 1; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font-data); font-size: 11px; letter-spacing: .04em; color: var(--muted); padding: 1px 6px; border-radius: 3px; background: rgba(10, 17, 22, .62); }
.lbl.strong { color: var(--fg); font-weight: 500; }
.lbl.e { color: var(--electron); } .lbl.h { color: var(--hole); } .lbl.g { color: var(--gate); } .lbl.i { color: var(--ion); }
.lbl.big { font-size: 15px; font-weight: 500; color: var(--fg); }

.head { position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 4px; max-width: min(460px, calc(100% - 32px)); }
.eyebrow { font-family: var(--font-data); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.title-row { display: flex; align-items: center; gap: 10px; }
.numeral { font-family: var(--font-data); font-size: 11px; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.nav { display: flex; gap: 4px; margin-left: 4px; }
.nav button { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 14px; cursor: pointer; }
.nav button:disabled { opacity: .3; cursor: default; }
.scale-chip { font-family: var(--font-data); font-size: 11px; color: var(--electron); }

.rail { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); top: 122px; display: grid; gap: 9px; }
.rail .part { font-family: var(--font-data); font-size: 9.5px; letter-spacing: .16em; color: var(--muted); opacity: .7; margin-top: 4px; margin-left: -2px; }
.rail button { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-family: var(--font-body); font-size: 12px; text-align: left; }
.rail .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
.rail button[aria-current="step"] { color: var(--fg); }
.rail button[aria-current="step"] .dot { background: var(--electron); border-color: var(--electron); box-shadow: 0 0 10px var(--electron); }
.rail button.done .dot { border-color: var(--ok); }
.rail .name { opacity: 0; transition: opacity .2s; }
.rail:hover .name, .rail button[aria-current="step"] .name { opacity: 1; }

.ruler { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-58%); width: 80px; height: 400px; }
.ruler svg { width: 100%; height: 100%; overflow: visible; }

.dock { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.dock > * { pointer-events: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.task { width: min(410px, 100%); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; max-height: calc(100vh - 150px); overflow: auto; }
.task-body { display: grid; gap: 10px; }
.task-top { display: flex; align-items: center; gap: 8px; }
.your-turn { font-family: var(--font-data); font-size: 10.5px; letter-spacing: .18em; color: var(--muted); }
.your-turn::before { content: ""; display: inline-block; width: 36px; border-top: 1px dashed var(--electron); vertical-align: middle; margin-right: 8px; }
.goal { margin-left: auto; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; text-align: right; }
.goal.met { color: var(--ok); border-color: var(--ok); }
.prompt { margin: 0; font-weight: 500; }
.explain { margin: 0; color: var(--muted); font-size: 13px; min-height: 3.2em; }
.ctrl { display: grid; gap: 4px; }
.ctrl label, .ctrl-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ctrl output { font-family: var(--font-data); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--electron); height: 26px; margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .btn { font: inherit; font-size: 12.5px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--electron); color: var(--electron); background: rgba(95, 225, 245, .08); }
.btn:hover, .seg button:hover { border-color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
input[type="range"]:focus-visible, button:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }

.meters { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 62%; }
.meter { padding: 8px 12px; min-width: 112px; display: grid; gap: 0; }
.meter .k, .gk { font-family: var(--font-data); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meter .k sub, .gk sub { text-transform: none; }
.meter .v { font-family: var(--font-data); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.meter .v small { font-size: 12px; color: var(--muted); margin-left: 3px; }
.meter .c { font-size: 11px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; }
.graph { padding: 10px 12px 8px; display: grid; gap: 4px; }
.graph canvas { width: 260px; height: 170px; display: block; }
.graph.tall canvas { width: 290px; height: 250px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.ring { background: none; border: 2px solid; width: 7px; height: 7px; }
.legend b { font-family: var(--font-data); margin-right: 4px; }

.quiz { position: absolute; inset: 0; display: grid; place-items: center; padding-block: 96px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto; }
.quiz:empty { display: none; }
.quiz-inner { width: min(640px, 100%); display: grid; gap: 12px; }
.q { padding: 14px 16px; display: grid; gap: 8px; }
.q h3 { margin: 0; font-size: 15px; font-weight: 700; }
.q .opts { display: grid; gap: 6px; }
.q button { text-align: left; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.q button:hover { border-color: var(--muted); }
.q button.right { border-color: var(--ok); color: var(--ok); }
.q button.wrong { border-color: var(--hole); color: var(--hole); }
.q .fb { margin: 0; font-size: 13px; color: var(--muted); }
.q .part-tag { font-family: var(--font-data); font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.score { font-family: var(--font-data); color: var(--muted); margin: 0; }
.note { font-size: 11.5px; color: var(--muted); margin: 0; }
.app.overlay .task, .app.overlay .ruler, .app.overlay .meters { display: none; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; display: flex; flex-direction: column; }
  .head { order: -2; position: static; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); max-width: none; }
  h1 { font-size: 22px; }
  .rail { order: -1; position: static; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 8px; }
  .rail .name { display: none; }
  .rail .part { margin: 0 0 0 4px; font-size: 9px; }
  .viewport { position: relative; inset: auto; height: 50svh; min-height: 300px; flex: none; }
  .ruler { display: none; }
  .dock { position: static; flex-direction: column; align-items: stretch; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .task { width: auto; max-height: none; }
  .meters { justify-content: flex-start; max-width: none; }
  .meter { flex: 1 1 120px; }
  .graph { flex: 1 1 100%; }
  .graph canvas, .graph.tall canvas { width: 100%; }
  .quiz { position: static; padding-block: 8px 32px; }
  .app.overlay .viewport { height: 26svh; min-height: 170px; }
}
@media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>

<div class="app" id="app">
  <div class="viewport" id="viewport">
    <canvas id="gl" aria-label="MOSFET の 3D 模型。ドラッグで向きを変えられます"></canvas>
    <div class="labels" id="labels"></div>
    <div class="fade" id="fade"></div>
  </div>

  <header class="head">
    <div class="eyebrow">MOSFET の内側 · n チャネル</div>
    <div class="title-row">
      <span class="numeral" id="numeral">I</span>
      <h1 id="chTitle">ただのスイッチ</h1>
      <div class="nav">
        <button id="prev" aria-label="前の章">‹</button>
        <button id="next" aria-label="次の章">›</button>
      </div>
    </div>
    <div class="scale-chip" id="scaleChip">×1 · 机の上</div>
  </header>

  <nav class="rail" id="rail" aria-label="章"></nav>

  <div class="ruler" aria-hidden="true"><svg id="ruler" viewBox="0 0 80 400"></svg></div>

  <section class="quiz" id="quiz" aria-label="確認問題"></section>

  <div class="dock">
    <div class="task card">
      <div class="task-top"><span class="your-turn">やってみよう</span><span class="goal" id="goal"></span></div>
      <div class="task-body" id="taskBody"></div>
    </div>
    <div class="meters" id="meters"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="core/physics.js"></script>
<script src="viz/kit.js"></script>
<script src="chapters/a-intro.js"></script>
<script src="chapters/b-material.js"></script>
<script src="chapters/c-junction.js"></script>
<script src="chapters/d-mos.js"></script>
<script src="chapters/e-quiz.js"></script>
<script src="app.js"></script>
