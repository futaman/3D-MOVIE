[project]
name = "movie-worker"
version = "0.1.0"
description = "3D-MOVIE GPU ワーカー(生成・リグ・レンダリング)"
requires-python = ">=3.11"
dependencies = [
  "rq>=1.16",
  "redis>=5.0",
  "numpy>=1.26",
  "trimesh>=4.4",
  "scipy>=1.13",
  "pillow>=10",
  "pyyaml>=6",
  "movie-schema",
  "movie-api",
]

[project.optional-dependencies]
# 実モデル用。フェーズ 0 で確定後に固定する(torch は CUDA 12.4 ホイールを Dockerfile 側で入れる)
gpu = []
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["movie_worker*"]

[tool.uv.sources]
movie-schema = { path = "../../packages/schema", editable = true }
movie-api = { path = "../api", editable = true }
