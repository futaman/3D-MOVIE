[project]
name = "movie-api"
version = "0.1.0"
description = "3D-MOVIE API(アセット・シーン・ジョブ・進捗 WebSocket)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=1.16",
  "pydantic-settings>=2.4",
  "python-ulid>=2.7",
  "python-multipart>=0.0.9",
  "movie-schema",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["movie_api*"]

[tool.uv.sources]
movie-schema = { path = "../../packages/schema", editable = true }
